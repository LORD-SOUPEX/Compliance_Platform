[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [".venv", ".tools", "reports", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pylint.main]
py-version = "3.11"
ignore = [".venv", ".tools", "reports"]

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116", "R0903"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = '(?x)(^|/)(\.venv|\.tools|reports|\.git)/'
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = [".venv", ".tools", "reports", "tests"]
