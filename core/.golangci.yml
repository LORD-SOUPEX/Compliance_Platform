# Lint of the engine itself: golangci-lint run ./... from core/.
version: "2"
run:
  timeout: 5m
linters:
  default: none
  # nilerr is left out: directory walks skip unreadable entries on purpose.
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - bodyclose
  settings:
    staticcheck:
      checks:
        - all
        # French identifiers and messages: punctuation and capitals are deliberate.
        - -ST1005
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
        # Style-only quick fixes.
        - -QF1001
        - -QF1003
formatters:
  enable:
    - gofmt
