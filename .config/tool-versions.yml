schema: 1
dependency_lock: requirements-dev.lock

python:
  version: "3.11.9"
  architecture: windows-x64
  install_type: official_pythoncore_zip
  source: https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.zip
  sha256: 4ba90a4ab8990891033d37ff04d2047fdae8948d0d2729a68d3a6a17c585b681
  checksum_source: https://www.python.org/ftp/python/3.11.9/windows-3.11.9.json
  local_path: .tools/python

python_packages:
  - name: pip
    version: "26.2.1"
    source: https://pypi.org/project/pip/
  - name: setuptools
    version: "84.0.0"
    source: https://pypi.org/project/setuptools/
  - name: pre-commit
    version: "4.6.2"
    source: https://pypi.org/project/pre-commit/
  - name: ruff
    version: "0.16.10"
    source: https://pypi.org/project/ruff/
  - name: pylint
    version: "4.1.2"
    source: https://pypi.org/project/pylint/
  - name: mypy
    version: "2.4.0"
    source: https://pypi.org/project/mypy/
  - name: pytest
    version: "9.1.1"
    source: https://pypi.org/project/pytest/
  - name: pytest-cov
    version: "7.1.0"
    source: https://pypi.org/project/pytest-cov/
  - name: bandit
    version: "1.9.4"
    source: https://pypi.org/project/bandit/
  - name: pip-audit
    version: "2.10.1"
    source: https://pypi.org/project/pip-audit/
  - name: yamllint
    version: "1.38.0"
    source: https://pypi.org/project/yamllint/
  - name: ansible-core
    version: "2.19.14"
    source: https://pypi.org/project/ansible-core/
    platforms: linux,macos,windows-package-only
  - name: ansible-lint
    version: "25.12.2"
    source: https://pypi.org/project/ansible-lint/
    platforms: linux,macos,windows-package-only
  - name: molecule
    version: "25.12.0"
    source: https://pypi.org/project/molecule/
    platforms: linux,macos,windows-package-only
  - name: checkov
    version: "3.3.23"
    source: https://pypi.org/project/checkov/

powershell:
  psscriptanalyzer:
    version: "1.25.0"
    install_type: Save-Module
    source: https://www.powershellgallery.com/packages/PSScriptAnalyzer/1.25.0
    local_path: .tools/powershell-modules
    minimum_powershell: "5.1"
    checksum: not_published_by_gallery

binary_tools:
  gitleaks:
    version: "8.30.1"
    source: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
    asset: gitleaks_8.30.1_windows_x64.zip
    checksum_asset: gitleaks_8.30.1_checksums.txt
    checksum_asset_sha256: 061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae
    local_path: .tools/bin/gitleaks.exe
    version_args: version
    required: true
  tflint:
    version: "0.64.0"
    source: https://github.com/terraform-linters/tflint/releases/download/v0.64.0
    asset: tflint_windows_amd64.zip
    checksum_asset: checksums.txt
    checksum_asset_sha256: 07496dc0ab06a39fa718a9f8e471112b6e6ab4fd3a9f1024210a55fe3f1a9ff9
    local_path: .tools/bin/tflint.exe
    version_args: --version
    required: true
  terragrunt:
    version: "1.1.6"
    source: https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.6
    asset: terragrunt_windows_amd64.exe
    checksum_asset: SHA256SUMS
    checksum_asset_sha256: c4228c27520adc285464c02602d71e98d957a28657cfdb290267eab60dd04bf3
    local_path: .tools/bin/terragrunt.exe
    version_args: --version
    required: false
  hadolint:
    version: "2.15.1"
    source: https://github.com/hadolint/hadolint/releases/download/v2.15.1
    asset: hadolint-windows-x86_64.exe
    checksum_asset: checksums.sha256
    checksum_asset_sha256: 4d09c27d4f8151c586b83a9390eaa5843b1e2af2a67df61a53b18b2df4c769d4
    local_path: .tools/bin/hadolint.exe
    version_args: --version
    required: true
  trivy:
    version: "0.75.0"
    source: https://github.com/aquasecurity/trivy/releases/download/v0.75.0
    asset: trivy_0.75.0_windows-64bit.zip
    checksum_asset: trivy_0.75.0_checksums.txt
    checksum_asset_sha256: 43a87485d39b60dae55cb1a14725dddd612040c0b1ec4caa88948c07d6c06219
    local_path: .tools/bin/trivy.exe
    version_args: --version
    required: true
  shellcheck:
    version: "0.11.0"
    source: https://github.com/koalaman/shellcheck/releases/tag/v0.11.0
    platforms: linux,macos
    local_path: .tools/bin/shellcheck
    required: false
    checksum: unavailable_for_windows

markdownlint:
  version: "0.18.1"
  install_type: pre-commit_node_hook
  source: https://github.com/DavidAnson/markdownlint-cli2
  local_cache: .tools/pre-commit
  required: false
  node_runtime: "26.10.0"

terraform:
  version: "1.15.8"
  source: https://developer.hashicorp.com/terraform/install
  status: detected_on_audit_host
  install_type: external_existing_installation
  checksum: managed_by_hashicorp_distribution

optional_tools:
  docker_engine:
    status: not_required_for_filesystem_checks
  shellcheck_windows:
    status: not_available
  molecule_driver:
    status: requires_explicit_local_driver
