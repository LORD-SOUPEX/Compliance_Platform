repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
  - repo: local
    hooks:
      - id: markdownlint
        name: Validation Markdown
        entry: markdownlint-cli2
        language: node
        language_version: 26.10.0
        additional_dependencies: [markdownlint-cli2@0.18.1]
        types: [markdown]
      - id: scan-emojis
        name: Recherche des pictogrammes interdits
        entry: python scripts/check_emoji.py
        language: python
        types: [text]
        exclude: '\.(svg|sig)$'
  # Hooks officiels : binaires construits par pre-commit pour l'OS courant
  # (Windows, Linux, macOS), sans dépendre de .tools/bin.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
